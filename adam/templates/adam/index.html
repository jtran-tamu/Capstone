{% extends "adam/base.html" %}

{% block content %}
<div class="chat-container">
	<div class="chat-box" id="chatBox">
		{% if messages %}
			{% for m in messages %}
				<div class="message {{ m.role }}">
					<strong>{{ m.role|title }}:</strong> {{ m.content }}
				</div>
		{% endfor %}
		{% else %}
			<p class="text-gray-400 px-4 py-2"></p>
		{% endif %}
	</div>
	<div class="chat-input">
		<textarea id="chatInput" placeholder="Type a message..."></textarea>
		<button onclick="sendMessage()">Send</button>
	</div>
</div>

<script>
		function sendMessage() {
		const chatBox = document.getElementById("chatBox");
		const chatInput = document.getElementById("chatInput");
		const message = chatInput.value.trim();

		if (message) {
			// Show user message
			const userMsg = document.createElement("div");
			userMsg.classList.add("message");
			userMsg.innerHTML = `<strong>You:</strong> ${message}`;
			chatBox.appendChild(userMsg);

			// Clear input
			chatInput.value = "";

			// Send message to chatbot API
			fetch("/chatbot-api/", {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"X-CSRFToken": getCookie("csrftoken"),
				},
				body: JSON.stringify({ message: message })
			})
			.then(response => response.json())
			.then(data => {
				const botMsg = document.createElement("div");
				botMsg.classList.add("message");
				botMsg.innerHTML = `<strong>A.D.A.M:</strong> ${data.reply}`;
				chatBox.appendChild(botMsg);
				chatBox.scrollTop = chatBox.scrollHeight;
			})
			.catch(error => {
				const errorMsg = document.createElement("div");
				errorMsg.classList.add("message");
				errorMsg.innerHTML = `<strong>Error:</strong> Something went wrong.`;
				chatBox.appendChild(errorMsg);
			});
		}
	}

	// Grab CSRF token from cookie
	function getCookie(name) {
		let cookieValue = null;
		if (document.cookie && document.cookie !== '') {
			const cookies = document.cookie.split(';');
			for (let i = 0; i < cookies.length; i++) {
				const cookie = cookies[i].trim();
				if (cookie.substring(0, name.length + 1) === (name + '=')) {
					cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
					break;
				}
			}
		}
		return cookieValue;
	}
</script>

<style>
	html, body {
		margin: 0;
		padding: 0;
		height: 100%;
		background: #2f3136;
	}
	.chat-container {
		width: 100%;
		height: auto;
		display: flex;
		flex-direction: column;
		border-radius: 0;
		overflow: hidden;
		background: #36393f;
		color: white;
		margin: 0;
		padding: 0;
        }

	div#chatBox {
		height: 700px;
	}
	.chat-box {
		flex-grow: 1;
		padding: 1px;
		overflow-y: auto;
		background: #2f3136;
	}
	.chat-input {
		display: flex;
		border-top: 1px solid #202225;
		background: #40444b;
	}
	.chat-input textarea {
		flex-grow: 1;
		padding: 10px;
		border: none;
		resize: none;
		background: #40444b;
		color: white;
	}
	.chat-input button {
		padding: 10px 15px;
		border: none;
		background: #7289da;
		color: white;
		cursor: pointer;
	}
	.chat-input button:hover {
		background: #5b6eae;
	}
	.message {
		padding: 10px;
		margin: 5px 0;
		background: #40444b;
		border-radius: 5px;
	}
</style>
{% endblock content %}
