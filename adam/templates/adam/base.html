{% load static %}

<!DOCTYPE HTML>
<html>
	<head>
		<title>Jenny's Capstone Project</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href={% static "assets/css/main.css" %} />
		<link rel="stylesheet" href={% static "assets/css/sticky-footer.css" %}/>
	</head>
	<body class="is-preload">

		<!-- Header -->
			<div id="header">

				<div class="top">

					<!-- Logo -->
						<div id="logo">
							<span class="image avatar48"><img src={% static "images/ADAM_logo.png" %} alt="" /></span>
							<h1 id="title">A.D.A.M</h1>
						</div>

					<!-- Nav -->
						<nav id="nav">
							<ul>
								<li><a href={% url "adam:home" %} id="home-link"><span class="icon solid fa-home">Home</span></a></li>
								<li><a href={% url "adam:teams" %} id="teams-link"><span class="icon solid fa-th">Teams</span></a></li>
								<li><a href={% url "adam:profile" %} id="profile-link"><span class="icon solid fa-user">Profile</span></a></li>
							</ul>
						</nav>
				</div>
			</div>

<!-- Main -->
<div id="main">

	<!-- Portfolio -->
		<section id="portfolio">
			<div class="container">
				{% block content %}{% endblock content %}
			</div>
		</section>

</div>

<!-- Footer -->
<div id="footer">

	<!-- Copyright -->
		<ul class="copyright">
			<li>Jenny's Capstone Project.</li><li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
		</ul>

</div>

</body>
