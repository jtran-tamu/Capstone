{% extends "adam/base.html" %}

{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Summary</title>
    <link rel="stylesheet" href="main.css">
    <style>
        .summary-container {
            width: 60%;
            margin: 50px auto;
            padding: 20px;
            background: #2f3136;
            color: white;
            border-radius: 10px;
        }
        .summary-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .artist-name {
            font-size: 22px;
            font-weight: bold;
            color: #7289da;
            margin-top: 10px;
        }
        .summary-paragraph {
            font-size: 16px;
            line-height: 1.5;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    {% for summary in summaries %}
    <div class="summary-container">
        <div class="summary-header">
            <h1>Artist Summary</h1>
            <div class="artist-name">{{ summary.artist.user.username }}</div>
        </div>
        <div class="summary-paragraph">
            <p>{{ summary.summary }}</p>
        </div>
    </div>
    {% endfor %}
</body>
</html>
{% endblock content %}
